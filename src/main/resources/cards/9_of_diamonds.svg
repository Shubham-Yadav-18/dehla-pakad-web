<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <!-- 
      1. THE SUIT TEMPLATE 
      Using the exact path data from your original SVG file.
      The viewBox "38 12 24 24" perfectly frames this specific path coordinates.
    -->
   <!-- THE DIAMOND TEMPLATE -->
    <!-- viewBox perfectly frames X: -8 to 8, Y: -10.5 to 10.5 -->
    <symbol id="suit" viewBox="-8.5 -11 17 22">
      <path fill="#df0000" d="M 3.2433274,-4.7253274 C 1.1263274,-7.5893274 0,-10.5 0,-10.5 c 0,0 -1.1263274,2.9106726 -3.2433274,5.7746726 C -5.3613274,-1.8623274 -8,0 -8,0 -8,0 -5.3613274,1.8613274 -3.2433274,4.7263274 -1.1263274,7.5893274 0,10.5 0,10.5 0,10.5 1.1263274,7.5893274 3.2433274,4.7263274 5.3613274,1.8613274 8,0 8,0 8,0 5.3613274,-1.8623274 3.2433274,-4.7253274 z" />
    </symbol>

    <!-- 
      2. THE CORNER TEMPLATE
      Matches your requested layout: Rank on top, Suit on bottom.
    -->
    <g id="corner">
      <!-- Using Arial to match your original file's text spec -->
<!-- Notice the fill="#df0000" -->
      <text x="35" y="60" font-family="Arial, sans-serif" font-weight="bold" font-size="52" fill="#df0000" text-anchor="middle">9</text>      <!-- Small suit placed perfectly under the number -->
      <use href="#suit" x="15" y="65" width="40" height="40" />
    </g>
  </defs>

  <!-- 3. THE CARD BASE (Zero borders, solid white, perfectly rounded) -->
  <rect width="300" height="420" rx="16" fill="#ffffff" />

  <!-- 4. TOP-LEFT CORNER -->
  <use href="#corner" />

  <!-- 5. BOTTOM-RIGHT CORNER (Rotated 180 degrees around the exact center of 300x420) -->
  <use href="#corner" transform="rotate(180, 150, 210)" />

  <!-- 6. THE BIG CENTER SUIT -->
  <use href="#suit" x="85" y="145" width="130" height="130" />
</svg>
